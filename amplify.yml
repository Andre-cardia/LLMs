version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - node --version
    build:
      commands:
        - npm run validate
        - npm run build
        - test -s dist/ui/index.html
        - test -s dist/ui/app/index.html
        - test -s dist/ui/app/ui/main.mjs
  artifacts:
    baseDirectory: dist/ui
    files:
      - '**/*'

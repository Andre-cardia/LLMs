customHeaders:
  - pattern: '/assets/cesium-config.json'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'
  - pattern: '/prototype-cesium*'
    headers:
      - key: 'Referrer-Policy'
        value: 'origin'
  - pattern: '/app'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
  - pattern: '/app/'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
  - pattern: '/app/**'
    headers:
      - key: 'Content-Security-Policy'
        value: "default-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'Referrer-Policy'
        value: 'no-referrer'
  - pattern: '/app/**/*.mjs'
    headers:
      - key: 'Content-Type'
        value: 'text/javascript; charset=utf-8'
  - pattern: '/app/ui/fixtures/**'
    headers:
      - key: 'Cache-Control'
        value: 'no-store'

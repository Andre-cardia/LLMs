              return result;
            }
            const owner = typeof context?.awsRequestId === 'string' && context.awsRequestId !== '' ? context.awsRequestId : 'manual-invoke';
            const remainingMs = typeof context?.getRemainingTimeInMillis === 'function' ? () => context.getRemainingTimeInMillis() : undefined;
            return createSnapshotPublisherHandler({store, clock: () => new Date().toISOString(), owner, remainingMs})(event);
          }

          module.exports = {handler, createSnapshotPublisherHandler, LEASE_TTL_MS};

  # ---------------------------------------------------------------- HTTP API
  # CORS só no gateway (AD-26): com CorsConfiguration e sem rota OPTIONS, o API Gateway
  # responde o preflight sem passar pelo authorizer. A Lambda não emite cabeçalhos CORS.
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub 'llms-${EnvironmentName}-api'
      ProtocolType: HTTP
      DisableExecuteApiEndpoint: false
      CorsConfiguration:
        AllowOrigins:
          - !Ref AppOrigin
        AllowMethods:
          - GET
        AllowHeaders:
          - Authorization
        AllowCredentials: false
        MaxAge: 600

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: cognito-access-token
      AuthorizerType: JWT
      IdentitySource:
        - $request.header.Authorization
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
        Audience:
          - !Ref AppClient

  OwnerGateIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OwnerGateFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 5000

  WhoamiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/v1/whoami
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - llms-api/read
      Target: !Sub 'integrations/${OwnerGateIntegration}'

  SnapshotReaderIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SnapshotReaderFunction.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 6000

  SnapshotManifestRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/v1/snapshot
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - llms-api/read
      Target: !Sub 'integrations/${SnapshotReaderIntegration}'

  SnapshotSliceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: GET /api/v1/snapshots/{revision}/{slice}
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer
      AuthorizationScopes:
        - llms-api/read
      Target: !Sub 'integrations/${SnapshotReaderIntegration}'

  DefaultStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true
      # Auditoria de acesso (401 do authorizer, 403 do dono): sem header Authorization nem claims.
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","time":"$context.requestTime","route":"$context.routeKey","status":"$context.status","ip":"$context.identity.sourceIp","authorizerError":"$context.authorizer.error","integrationStatus":"$context.integrationStatus"}'
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/llms-${EnvironmentName}-api'
      RetentionInDays: 90

  # ---------------------------------------------------------------- S3
  # Snapshots privados (AD-2/AD-9). A snapshot-reader lê (AD-27); só a snapshot-publisher escreve (Q2).
  SnapshotBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'llms-${EnvironmentName}-snapshots-${AWS::AccountId}-${AWS::Region}'
      # Versões antigas e uploads incompletos não se acumulam (AD-27 mantém as 3 últimas revisões legíveis).
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-and-abort-multipart
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled

  SnapshotBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SnapshotBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SnapshotBucket.Arn
              - !Sub '${SnapshotBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
          - Sid: DenyPresignedUrls
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt SnapshotBucket.Arn
              - !Sub '${SnapshotBucket.Arn}/*'
            Condition:
              StringEquals:
                s3:authType: REST-QUERY-STRING
          # Slices e manifestos de revisão são imutáveis: PutObject sem If-None-Match é negado
          # (escrita condicional imposta, S3 User Guide "Enforce conditional writes").
          - Sid: DenyUnconditionalImmutablePut
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource:
              - !Sub '${SnapshotBucket.Arn}/slices/*'
              - !Sub '${SnapshotBucket.Arn}/manifest/revisions/*'
            Condition:
              'Null':
                s3:if-none-match: 'true'
          # Ponteiro e lease só mudam por escrita condicional (criação ou If-Match): nenhum
          # PutObject cego troca o snapshot publicado nem o lease.
          - Sid: DenyBlindPointerAndLeasePut
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource:
              - !Sub '${SnapshotBucket.Arn}/manifest/current.json'
              - !Sub '${SnapshotBucket.Arn}/control/*'
            Condition:
              'Null':
                s3:if-match: 'true'
                s3:if-none-match: 'true'

Outputs:
  ApiOrigin:
    Description: Origem da HTTP API (connect-src da CSP do shell, AD-26).
    Value: !GetAtt HttpApi.ApiEndpoint
  CognitoDomain:
    Description: Origem do managed login (connect-src e /oauth2/*).
    Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com'
  UserPoolId:
    Description: ID do user pool (emissor do JWT).
    Value: !Ref UserPool
  AppClientId:
    Description: Client id público do shell (Audience do authorizer).
    Value: !Ref AppClient
  SnapshotBucketName:
    Description: Bucket privado de snapshots.
    Value: !Ref SnapshotBucket
